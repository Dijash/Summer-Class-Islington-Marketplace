{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Portal Login - MarketPlace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/superadmin/style.css' %}">
</head>
<body class="login-body">

<div class="login-card">
    <div class="brand-badge">
        <i class="fa-solid fa-shield-halved"></i> Jazzmin Admin Suite
    </div>
    <h1 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem; color: #0f172a;">Super Admin Login</h1>
    <p style="font-size: 0.88rem; color: #64748b; margin-bottom: 2rem;">Authorized platform superuser management control desk</p>

    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="msg-error"><i class="fa-solid fa-circle-exclamation"></i> {{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Superuser Username or Email</label>
            <input type="text" name="username" placeholder="e.g. supersuer@gmail.com" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••••••" required>
        </div>
        <button type="submit" class="btn-submit">
            <i class="fa-solid fa-lock"></i> Authenticate & Enter Dashboard
        </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid #e2e8f0; font-size: 0.8rem; color: #64748b;">
        <a href="{% url 'home' %}" style="color: #64748b; text-decoration: none; font-weight: 600;">← Return to Main Marketplace Website</a>
    </div>
</div>

</body>
</html>
